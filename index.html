<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content5="width=device-width, initial-scale=1.0">
    <title>LocalAI Engine - AI Ad Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        <div class="text-center mb-6">
            <span class="bg-indigo-500/10 text-indigo-400 text-xs font-semibold px-3 py-1 rounded-full border border-indigo-500/20">SaaS MVP v1.0</span>
            <h1 class="text-2xl font-bold mt-3">LocalAI Engine</h1>
            <p class="text-slate-400 text-sm mt-1">Upload your product photo to generate instant AI marketing & video ads.</p>
        </div>
        
        <div class="space-y-4">
            <div class="border-2 border-dashed border-slate-700 rounded-xl p-6 text-center hover:border-indigo-500 transition cursor-pointer">
                <svg class="mx-auto h-12 w-12 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                <p class="text-sm text-slate-300 mt-2">Click to upload product photo</p>
                <p class="text-xs text-slate-500 mt-1">PNG, JPG up to 10MB</p>
            </div>

            <button class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-indigo-600/30">
                Generate AI Ad & Video 🚀
            </button>
        </div>
    </div>
</body>
</html>
