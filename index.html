<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalAI Engine - AI Ad Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        <div class="text-center mb-6">
            <span class="bg-indigo-500/10 text-indigo-400 text-xs font-semibold px-3 py-1 rounded-full border border-indigo-500/20">SaaS MVP v2.0</span>
            <h1 class="text-2xl font-bold mt-3">LocalAI Engine</h1>
            <p class="text-slate-400 text-sm mt-1">Upload your product photo to generate instant AI marketing copy.</p>
        </div>
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Google Gemini API Key</label>
                <input type="password" id="apiKey" placeholder="AIzaSy..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Product Image</label>
                <input type="file" id="imageInput" accept="image/*" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
            </div>

            <button id="generateBtn" onclick="generateAd()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-indigo-600/30">
                Generate AI Ad 🚀
            </button>

            <div id="resultContainer" class="hidden mt-4 p-4 bg-slate-950 border border-slate-800 rounded-xl">
                <h3 class="text-xs font-semibold text-indigo-400 uppercase tracking-wider mb-2">Generated Marketing Copy:</h3>
                <p id="output" class="text-sm text-slate-300 whitespace-pre-line"></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { GoogleGenAI } from "@google/genai";

        window.generateAd = async function() {
            const apiKey = document.getElementById('apiKey').value;
            const imageInput = document.getElementById('imageInput').files[0];
            const outputDiv = document.getElementById('output');
            const resultContainer = document.getElementById('resultContainer');
            const btn = document.getElementById('generateBtn');

            if (!apiKey) {
                alert('Please enter your Google Gemini API Key!');
                return;
            }
            if (!imageInput) {
                alert('Please select a product image!');
                return;
            }

            btn.textContent = 'Generating... 🤖';
            btn.disabled = true;

            try {
                const ai = new GoogleGenAI({ apiKey: apiKey });

                const reader = new FileReader();
                reader.readAsDataURL(imageInput);
                reader.onload = async function () {
                    const base64Data = reader.result.split(',')[1];

                    const response = await ai.models.generateContent({
                        model: 'gemini-3.8-flash',
                        contents: [
                            {
                                text: "Analyze this product photo for a local store. Write a catchy marketing caption for Instagram/TikTok and suggest 3 relevant hashtags."
                            },
                            {
                                inlineData: {
                                    mimeType: imageInput.type,
                                    data: base64Data
                                }
                            }
                        ]
                    });

                    outputDiv.textContent = response.text;
                    resultContainer.classList.remove('hidden');
                    btn.textContent = 'Generate AI Ad 🚀';
                    btn.disabled = false;
                };
            } catch (error) {
                alert('Error: ' + error.message);
                btn.textContent = 'Generate AI Ad 🚀';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
